name: Academy checks and Android APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser Python runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle original engines for web and Android
        run: npm run prepare:practice
      - name: Verify original engines in WebAssembly
        run: npm run test:wasm
      - name: Verify direct feedback, admin authentication and analytics
        run: npm run test:services && npm run test:navigation
      - name: Build shared content
        run: python tools/build_advanced_content.py && python tools/build_extended_content.py && python tools/build_content.py
      - name: Check generated content is committed
        run: git diff --exit-code web/engine/extended_catalog.json services/academy-api/cases.js web/engine/advanced_catalog.json shared/catalog.json web/catalog.json app/src/main/assets/catalog.json
      - name: Test account isolation, progression and offline replay
        run: python -m unittest discover -s tests -v
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/sw.js
          node --check web/student.js
          node --check web/welcome.js
          node --check web/decision-view.js
          node --check web/challenges.js
          node --check web/foundations.js
          node --check web/foundations-model.js
          node --check web/foundations-content.js
          node --check web/academy.js
          node --check web/studio.js
          node --check web/engine-worker.js
          node --check web/offline-bridge.js
  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle local practice engine
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run prepare:practice
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native Android APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Between-Bytes-Academy-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  android-smoke:
    needs: [quality, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle the same browser runtime into the APK
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run prepare:practice
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise bundled Python, SQLite and sandboxed XSS in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-practice-instrumentation-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  publish-apk:
    needs: [quality, android, android-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Between-Bytes-Academy-debug-APK
          path: apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp apk/app-debug.apk Between-Bytes-Academy.apk
          release_version=$(python -c "import re,pathlib; print(re.search(r\"versionName '([^']+)'\", pathlib.Path('app/build.gradle').read_text()).group(1))")
          release_tag="v${release_version}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already published; preserving the existing APK and signing identity.'
          else
            gh release create "$release_tag" Between-Bytes-Academy.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Between Bytes Academy ${release_version} (preview)" --notes-file docs/RELEASE_NOTES.md --latest
          fi

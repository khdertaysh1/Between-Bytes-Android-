name: Publish Academy Web on GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/prepare_practice.mjs', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-pages
  cancel-in-progress: false
jobs:
  availability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Check whether Pages has been enabled by the repository owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'To enable hosting: repository Settings > Pages > Source > GitHub Actions. Then run this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: availability
    if: needs.availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle the self-hosted browser Python runtime
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run prepare:practice
      - name: Verify all original non-browser engine invariants
        run: npm run test:wasm
      - name: Validate public web scripts
        run: |
          node --check web/app.js
          node --check web/config.js
          node --check web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
